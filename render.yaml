# Render single-service deployment.
# The web service builds the React bundle, installs Python deps, runs
# migrations + seed, and serves the API + SPA from one Django process.
services:
  - type: web
    name: playto-kyc
    runtime: python
    plan: free
    buildCommand: |
      cd frontend && npm ci && npx vite build --outDir ../backend/frontend_dist --emptyOutDir &&
      cd ../backend && pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: |
      cd backend && python manage.py migrate && python manage.py seed &&
      gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: DATABASE_URL
        fromDatabase:
          name: playto-kyc-db
          property: connectionString
    disk:
      name: media
      mountPath: /opt/render/project/src/backend/media
      sizeGB: 1

databases:
  - name: playto-kyc-db
    plan: free
    databaseName: kyc
    user: kyc
